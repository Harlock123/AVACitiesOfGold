# Every push: build and test, then publish AVACitiesOfGold as a self-contained single-file program for Windows, macOS
# and Linux on Intel/AMD and ARM. The builds are attached to the workflow run; pushes to main also
# refresh the "latest" pre-release, and a v* tag (e.g. v0.1.0) makes a proper release.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch cancels an older run still in progress, so the rolling "latest"
# release can never be overwritten by an older build that finished later.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build AVACitiesOfGold.slnx -c Release
      - name: Test
        run: dotnet test AVACitiesOfGold.slnx -c Release --no-build

  publish:
    needs: build
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19
    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - win-x86
          - win-arm64
          - linux-x64
          - linux-arm64
          - linux-arm
          - osx-x64
          - osx-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish ${{ matrix.rid }}
        # IncludeAllContentForSelfExtract bundles any content files too; AppContext.BaseDirectory then
        # points at the extraction folder, so they are found wherever the program is started from.
        run: >
          dotnet publish src/AVACitiesOfGold/AVACitiesOfGold.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish/${{ matrix.rid }}
      - name: Package
        # Windows gets a zip; everything else a tar.gz, which keeps the executable bit.
        run: |
          mkdir -p artifacts
          name="AVACitiesOfGold-${{ matrix.rid }}"
          cd publish/${{ matrix.rid }}
          cp ../../README.md .
          if [ -f ../../LICENSE ]; then cp ../../LICENSE .; fi
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            zip -9 -r "../../artifacts/$name.zip" .
          else
            chmod +x AVACitiesOfGold
            tar -czf "../../artifacts/$name.tar.gz" .
          fi
      - uses: actions/upload-artifact@v7
        with:
          # Uploaded as-is (no zip around the zip/tar.gz): the artifact is named after the file.
          path: artifacts/AVACitiesOfGold-${{ matrix.rid }}.*
          archive: false
          if-no-files-found: error

  release:
    needs: publish
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
          # The builds were uploaded as their own .zip/.tar.gz files: keep them that way.
          skip-decompress: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Retry GitHub API calls a few times: a transient error must not leave a half-done release.
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "attempt $i failed: $*" >&2; sleep $((i * 15)); done; return 1; }
          notes="Built automatically from ${GITHUB_SHA::7} on main. Unzip or untar and run AVACitiesOfGold (./AVACitiesOfGold on Linux and macOS, AVACitiesOfGold.exe on Windows)."
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            retry gh release create "$GITHUB_REF_NAME" artifacts/* --title "AVACitiesOfGold $GITHUB_REF_NAME" --generate-notes
          elif gh release view latest >/dev/null 2>&1; then
            # A rolling pre-release of the newest main build, updated in place and never deleted: replace the
            # files first (the old release stays usable if this fails), then move the tag, then the notes.
            retry gh release upload latest artifacts/* --clobber
            retry gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true
            retry gh release edit latest --prerelease --target "$GITHUB_SHA" --title "Latest build (main)" --notes "$notes"
          else
            retry gh release create latest artifacts/* --prerelease --target "$GITHUB_SHA" \
              --title "Latest build (main)" --notes "$notes"
          fi
      - name: Refresh the portfolio site
        # Asks Harlock123.github.io to rebuild now, so harlock123.com and harlock123.github.io offer this build
        # straight away instead of at their daily rebuild. Never fails the release.
        env:
          SITE_REFRESH_TOKEN: ${{ secrets.SITE_REFRESH_TOKEN }}
        run: |
          if [ -z "$SITE_REFRESH_TOKEN" ]; then
            echo "::notice::SITE_REFRESH_TOKEN is not set; the site will pick this build up at its daily rebuild."
            exit 0
          fi
          curl -sSf -X POST https://api.github.com/repos/Harlock123/Harlock123.github.io/dispatches \
            -H "Authorization: Bearer $SITE_REFRESH_TOKEN" -H "Accept: application/vnd.github+json" \
            -d "{\"event_type\":\"portfolio-refresh\",\"client_payload\":{\"repo\":\"$GITHUB_REPOSITORY\"}}" \
            || echo "::warning::Could not ask the site to refresh; it will pick this build up at its daily rebuild."
